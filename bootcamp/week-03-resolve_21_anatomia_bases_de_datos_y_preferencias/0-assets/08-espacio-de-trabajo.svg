<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"
     aria-label="Los paneles compartidos de Resolve dispuestos alrededor del viewer: media pool a la izquierda, inspector a la derecha, timeline abajo y la barra de las siete paginas al pie. A la derecha, el menu Workspace con sus tres acciones de layout, la doble pantalla y el submenu Scripts desde el que arranca el puente del verificador.">
  <title>Paneles, layouts y el menu Workspace</title>
  <style>
    .bg   { fill: #101418; }
    .surf { fill: #191f26; stroke: #2f3a45; stroke-width: 1; }
    .surf2{ fill: #232b34; stroke: #2f3a45; stroke-width: 1; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #e8eef4; }
    .lbl  { font-size: 13px; font-weight: 600; fill: #e8eef4; }
    .s    { font-size: 12px; fill: #93a1b0; }
  </style>

  <rect class="bg" width="880" height="400"/>
  <text class="t h" x="40" y="38">Las siete paginas son siete disposiciones de los mismos paneles</text>
  <text class="t s" x="40" y="58">Se muestran y se ocultan desde el menu Workspace, que les da su nombre exacto</text>

  <rect class="surf" x="40" y="82" width="470" height="272" rx="6"/>
  <rect class="surf2" x="58" y="100" width="110" height="150" rx="4"/>
  <rect x="58" y="100" width="4" height="150" fill="#4a9eff"/>
  <text class="t s" x="70" y="120">Media Pool</text>
  <rect class="surf2" x="178" y="100" width="196" height="150" rx="4"/>
  <text class="t s" x="190" y="120">Viewer</text>
  <text class="t s" x="190" y="182">la imagen</text>
  <rect class="surf2" x="384" y="100" width="108" height="150" rx="4"/>
  <rect x="384" y="100" width="4" height="150" fill="#a371f7"/>
  <text class="t s" x="396" y="120">Inspector</text>
  <rect class="surf2" x="58" y="258" width="434" height="46" rx="4"/>
  <rect x="58" y="258" width="4" height="46" fill="#3fb950"/>
  <text class="t s" x="70" y="278">Timeline</text>
  <text class="t s" x="70" y="296">Cut, Edit, Fusion, Color y Fairlight</text>
  <rect class="surf2" x="58" y="312" width="434" height="28" rx="4"/>
  <text class="t s" x="70" y="331">Media   Cut   Edit   Fusion   Color   Fairlight   Deliver      Shift+2 a Shift+8</text>

  <rect class="surf" x="550" y="82" width="290" height="272" rx="6"/>
  <text class="t lbl" x="572" y="108">Menu Workspace</text>
  <rect class="surf2" x="572" y="122" width="246" height="26" rx="4"/>
  <text class="t s" x="584" y="140">Mostrar y ocultar paneles</text>
  <rect class="surf2" x="572" y="154" width="246" height="26" rx="4"/>
  <rect x="572" y="154" width="4" height="26" fill="#f5a524"/>
  <text class="t s" x="584" y="172">Reset UI Layout</text>
  <rect class="surf2" x="572" y="186" width="246" height="26" rx="4"/>
  <text class="t s" x="584" y="204">Layout Presets &gt; Save Layout Preset</text>
  <rect class="surf2" x="572" y="218" width="246" height="26" rx="4"/>
  <text class="t s" x="584" y="236">Doble pantalla</text>
  <rect class="surf2" x="572" y="250" width="246" height="26" rx="4"/>
  <rect x="572" y="250" width="4" height="26" fill="#3fb950"/>
  <text class="t s" x="584" y="268">Scripts &gt; Utility</text>
  <text class="t s" x="572" y="298">El scripting lanzado desde aqui</text>
  <text class="t s" x="572" y="316">funciona en Free. Desde una terminal,</text>
  <text class="t s" x="572" y="334">es Studio. De ahi sale el puente del</text>
  <text class="t s" x="572" y="348">verificador del bootcamp.</text>

  <text class="t s" x="40" y="382">Reset UI Layout devuelve la disposicion de fabrica y no toca el proyecto. Es la red de seguridad de la semana.</text>
</svg>
