<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"
     aria-label="Diagrama de un medio optimizado: el clip original en H.264 permanece intacto en su carpeta, Resolve genera una copia en codec intra-frame dentro de su carpeta de cache, el montaje usa esa copia y el render final vuelve al original.">
  <title>Qué hace un medio optimizado</title>
  <style>
    .bg   { fill: #101418; }
    .surf { fill: #191f26; stroke: #2f3a45; stroke-width: 1; }
    .surf2{ fill: #232b34; stroke: #2f3a45; stroke-width: 1; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #e8eef4; }
    .lbl  { font-size: 13px; font-weight: 600; fill: #e8eef4; }
    .s    { font-size: 12px; fill: #93a1b0; }
    .ok   { font-size: 12px; font-weight: 600; fill: #3fb950; }
    .am   { font-size: 12px; font-weight: 600; fill: #f5a524; }
  </style>

  <rect class="bg" width="880" height="400"/>
  <text class="t h" x="40" y="38">El original no se toca: se genera una copia fácil de leer y se monta con ella</text>

  <rect class="surf" x="40" y="62" width="368" height="150" rx="6"/>
  <rect x="40" y="62" width="4" height="150" fill="#4a9eff"/>
  <text class="t lbl" x="62" y="88">Tu carpeta de material</text>
  <rect class="surf2" x="62" y="104" width="324" height="44" rx="4"/>
  <text class="t s" x="78" y="124">entrevista.mp4 · H.264 long-GOP</text>
  <text class="t s" x="78" y="142">1920×1080 · 30 Mbit/s</text>
  <text class="t s" x="62" y="176">Se queda exactamente como estaba.</text>
  <text class="t s" x="62" y="194">Es lo que se usará al renderizar la entrega.</text>

  <path d="M416 130 L462 130" stroke="#4a9eff" stroke-width="2"/>
  <path d="M456 124 L464 130 L456 136 Z" fill="#4a9eff"/>
  <text class="t s" x="410" y="112">Generate</text>

  <rect class="surf" x="472" y="62" width="368" height="150" rx="6"/>
  <rect x="472" y="62" width="4" height="150" fill="#f5a524"/>
  <text class="t lbl" x="494" y="88">Carpeta de caché de Resolve</text>
  <rect class="surf2" x="494" y="104" width="324" height="44" rx="4"/>
  <text class="t s" x="510" y="124">copia optimizada · codec intra-frame</text>
  <text class="t s" x="510" y="142">480×270 a un cuarto · se lee sin esfuerzo</text>
  <text class="t am" x="494" y="176">No viaja con el proyecto: en otro equipo</text>
  <text class="t am" x="494" y="194">hay que generarla otra vez.</text>

  <rect class="surf" x="40" y="232" width="800" height="60" rx="6"/>
  <text class="t lbl" x="62" y="258">Playback &gt; Use Optimized Media if Available</text>
  <text class="t s"   x="62" y="280">Activado, el visor y la timeline salen de la copia. Desactivado, del original. Es el interruptor que lo comprueba.</text>

  <rect class="surf" x="40" y="312" width="800" height="60" rx="6"/>
  <text class="t ok" x="62" y="338">Al renderizar la entrega, Resolve vuelve siempre al material original.</text>
  <text class="t s"  x="62" y="360">Por eso se puede generar a baja resolución sin comprometer la calidad final.</text>
</svg>
