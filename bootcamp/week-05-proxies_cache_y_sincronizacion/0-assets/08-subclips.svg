<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img"
     aria-label="Diagrama de subclips: un archivo largo en el disco y tres subclips que apuntan a tramos distintos de el, cada uno con su punto de entrada y de salida, sus colas de margen y su propia metadata, sin duplicar ningun byte.">
  <title>Qué es un subclip</title>
  <style>
    .bg   { fill: #101418; }
    .surf { fill: #191f26; stroke: #2f3a45; stroke-width: 1; }
    .surf2{ fill: #232b34; stroke: #2f3a45; stroke-width: 1; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #e8eef4; }
    .lbl  { font-size: 13px; font-weight: 600; fill: #e8eef4; }
    .s    { font-size: 12px; fill: #93a1b0; }
    .ok   { font-size: 12px; font-weight: 600; fill: #3fb950; }
  </style>

  <rect class="bg" width="880" height="380"/>
  <text class="t h" x="40" y="38">Tres subclips, un solo archivo, cero bytes duplicados</text>

  <rect class="surf" x="40" y="62" width="800" height="96" rx="6"/>
  <text class="t lbl" x="60" y="88">El archivo en el disco · entrevista.mp4 · 42 minutos · 5 GB</text>
  <rect class="surf2" x="60" y="104" width="760" height="30" rx="3"/>
  <rect x="150" y="104" width="150" height="30" fill="#232b34" stroke="#3fb950"/>
  <rect x="380" y="104" width="130" height="30" fill="#232b34" stroke="#3fb950"/>
  <rect x="600" y="104" width="160" height="30" fill="#232b34" stroke="#3fb950"/>
  <text class="t s" x="60" y="152">En verde, los tramos que valen. El resto no se borra: sigue ahí por si lo necesitas.</text>

  <rect class="surf" x="40" y="178" width="800" height="122" rx="6"/>
  <text class="t lbl" x="60" y="204">En el media pool · tres referencias con entrada y salida propias</text>

  <rect class="surf2" x="60" y="220" width="240" height="60" rx="4"/>
  <rect x="60" y="220" width="4" height="60" fill="#3fb950"/>
  <text class="t s" x="78" y="242">entrevista-por-que-empezo</text>
  <text class="t s" x="78" y="264">00:03:12 → 00:05:40</text>

  <rect class="surf2" x="320" y="220" width="240" height="60" rx="4"/>
  <rect x="320" y="220" width="4" height="60" fill="#3fb950"/>
  <text class="t s" x="338" y="242">entrevista-la-anecdota</text>
  <text class="t s" x="338" y="264">00:11:02 → 00:13:15</text>

  <rect class="surf2" x="580" y="220" width="240" height="60" rx="4"/>
  <rect x="580" y="220" width="4" height="60" fill="#3fb950"/>
  <text class="t s" x="598" y="242">entrevista-el-cierre</text>
  <text class="t s" x="598" y="264">00:36:44 → 00:39:20</text>

  <rect class="surf" x="40" y="316" width="800" height="48" rx="6"/>
  <text class="t ok" x="60" y="346">Deja uno o dos segundos de cola a cada lado: sin margen no hay transición posible en la Semana 09.</text>
</svg>
