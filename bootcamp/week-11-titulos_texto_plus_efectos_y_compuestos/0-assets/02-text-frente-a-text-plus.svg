<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
     aria-label="Comparacion entre Text y Text plus: Text soporta rich text, con varios estilos dentro de un mismo bloque; Text plus tiene un solo estilo para todo el texto pero anade Write On, disposicion sobre formas y animacion por caracter. Debajo, los siete generadores de titulo con su marca de rich text.">
  <title>Text frente a Text+</title>
  <style>
    .bg{fill:#101418}
    .card{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .box{fill:#232b34;stroke:#2f3a45;stroke-width:1}
    .t{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif}
    .h{font-size:15px;font-weight:600;fill:#e8eef4}
    .col{font-size:13px;font-weight:600;fill:#4a9eff}
    .lbl{font-size:13px;font-weight:600;fill:#e8eef4}
    .s{font-size:12px;fill:#93a1b0}
    .ok{font-size:12px;font-weight:600;fill:#3fb950}
    .no{font-size:12px;font-weight:600;fill:#f85149}
    .am{font-size:12px;font-weight:600;fill:#f5a524}
  </style>
  <rect class="bg" width="880" height="470"/>
  <text class="t h" x="40" y="34">¿Varios estilos en el mismo bloque, o animación? Esa es toda la decisión.</text>

  <rect class="card" x="40" y="56" width="390" height="200" rx="4"/>
  <text class="t col" x="60" y="80">Text</text>
  <text class="t ok" x="120" y="80">RICH TEXT: SÍ</text>
  <rect class="box" x="60" y="94" width="350" height="76" rx="3"/>
  <text class="t" x="76" y="120" font-size="19" font-weight="700" fill="#e8eef4">Marta Ruiz</text>
  <text class="t" x="76" y="140" font-size="13" fill="#93a1b0">bióloga marina</text>
  <text class="t" x="76" y="160" font-size="11" fill="#4a9eff">Estación de Cabo Verde</text>
  <text class="t s" x="60" y="192">tres líneas, tres estilos, un solo clip</text>
  <text class="t s" x="60" y="212">se selecciona el trozo y se le da su estilo</text>
  <text class="t am" x="60" y="238">sin selección, el estilo va al bloque entero</text>

  <rect class="card" x="450" y="56" width="390" height="200" rx="4"/>
  <text class="t col" x="470" y="80">Text+</text>
  <text class="t no" x="530" y="80">RICH TEXT: NO</text>
  <rect class="box" x="470" y="94" width="350" height="76" rx="3"/>
  <text class="t" x="486" y="122" font-size="17" font-weight="600" fill="#e8eef4">Marta Ruiz</text>
  <text class="t" x="486" y="146" font-size="17" font-weight="600" fill="#e8eef4">bióloga marina</text>
  <text class="t s" x="700" y="122">un solo</text>
  <text class="t s" x="700" y="140">estilo</text>
  <text class="t s" x="700" y="158">para todo</text>
  <text class="t s" x="470" y="192">a cambio: Write On y Write Off con keyframes</text>
  <text class="t s" x="470" y="212">disposición en punto, marco, círculo o trayectoria</text>
  <text class="t s" x="470" y="232">animación por carácter, palabra y línea</text>
  <text class="t am" x="470" y="252">ocho elementos de sombreado independientes</text>

  <line x1="40" y1="278" x2="840" y2="278" stroke="#2f3a45" stroke-width="1"/>
  <text class="t col" x="40" y="304">LOS GENERADORES DE TÍTULO · Effects Library &gt; Toolbox &gt; Titles</text>

  <rect class="card" x="40" y="318" width="800" height="132" rx="4"/>
  <text class="t lbl" x="60" y="342">L / M / R Lower 3rd</text>
  <text class="t ok" x="240" y="342">rich text</text>
  <text class="t s" x="320" y="342">dos líneas ya colocadas en el título seguro, a izquierda, centro o derecha</text>

  <text class="t lbl" x="60" y="366">Scroll</text>
  <text class="t ok" x="240" y="366">rich text</text>
  <text class="t s" x="320" y="366">créditos que suben · la duración del clip marca la velocidad</text>

  <text class="t lbl" x="60" y="390">Text</text>
  <text class="t ok" x="240" y="390">rich text</text>
  <text class="t s" x="320" y="390">una palabra, una línea o un párrafo · tamaño en píxeles</text>

  <text class="t lbl" x="60" y="414">Text+</text>
  <text class="t no" x="240" y="414">un estilo</text>
  <text class="t s" x="320" y="414">el generador de Fusion en la Edit page · tamaño relativo al ancho</text>

  <text class="t lbl" x="60" y="438">MultiText · Fusion Titles</text>
  <text class="t s" x="320" y="438">varias capas de texto en un clip · plantillas con animación hecha</text>
</svg>
