<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
     aria-label="Anatomia de una transicion: dos clips con sus colas ocultas a los lados del punto de edicion, y la zona de solape que la transicion necesita y que se construye con esas colas. Debajo, las tres alineaciones posibles respecto al punto de edicion y que significa cada una.">
  <title>Anatomía de una transición</title>
  <style>
    .bg{fill:#101418}
    .card{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .clip{fill:#232b34;stroke:#2f3a45;stroke-width:1}
    .cola{fill:#191f26;stroke:#2f3a45;stroke-width:1;stroke-dasharray:4 3}
    .tr{fill:#232b34;stroke:#4a9eff;stroke-width:1.5}
    .t{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif}
    .h{font-size:15px;font-weight:600;fill:#e8eef4}
    .col{font-size:13px;font-weight:600;fill:#4a9eff}
    .lbl{font-size:13px;font-weight:600;fill:#e8eef4}
    .s{font-size:12px;fill:#93a1b0}
    .am{font-size:12px;font-weight:600;fill:#f5a524}
  </style>
  <rect class="bg" width="880" height="470"/>
  <text class="t h" x="40" y="34">Una transición se construye con material que ya estaba ahí y no se veía.</text>

  <text class="t col" x="40" y="70">LAS COLAS</text>

  <rect class="clip" x="40" y="84" width="290" height="40" rx="3"/>
  <text class="t lbl" x="140" y="109">plano que sale</text>
  <rect class="cola" x="330" y="84" width="110" height="40" rx="3"/>
  <text class="t s" x="346" y="109">cola oculta</text>

  <rect class="cola" x="380" y="134" width="110" height="40" rx="3"/>
  <text class="t s" x="396" y="159">cola oculta</text>
  <rect class="clip" x="490" y="134" width="290" height="40" rx="3"/>
  <text class="t lbl" x="590" y="159">plano que entra</text>

  <line x1="410" y1="76" x2="410" y2="184" stroke="#f5a524" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text class="t am" x="418" y="196">punto de edición</text>

  <rect x="380" y="200" width="60" height="16" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text class="t s" x="450" y="213">el solape que la transición necesita, y que sale de las dos colas</text>

  <text class="t am" x="40" y="240">Sin colas no hay transición: no hay imagen que enseñar durante el solape.</text>

  <rect class="card" x="40" y="256" width="800" height="66" rx="4"/>
  <text class="t col" x="60" y="278">CUANDO NO HAY BASTANTE, RESOLVE OFRECE TRES SALIDAS</text>
  <text class="t lbl" x="60" y="302">Trim Clips</text>
  <text class="t s" x="150" y="302">acorta los dos lados para crear el solape · MODIFICA TU MONTAJE</text>
  <text class="t lbl" x="60" y="316">Skip Clips / Cancel</text>
  <text class="t s" x="200" y="316">no lo pone · o lo creas a mano con Alt+Shift (Win) / Opt+Shift (Mac) arrastrando</text>

  <line x1="40" y1="342" x2="840" y2="342" stroke="#2f3a45" stroke-width="1"/>
  <text class="t col" x="40" y="368">LAS TRES ALINEACIONES · Alignment, en el Inspector</text>

  <rect class="clip" x="40" y="382" width="110" height="30" rx="3"/>
  <rect class="tr" x="150" y="382" width="60" height="30" rx="3"/>
  <rect class="clip" x="210" y="382" width="110" height="30" rx="3"/>
  <line x1="180" y1="376" x2="180" y2="418" stroke="#f5a524" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text class="t lbl" x="40" y="434">Center on Edit</text>
  <text class="t s" x="40" y="452">lo normal: el corte queda en medio</text>

  <rect class="clip" x="330" y="382" width="110" height="30" rx="3"/>
  <rect class="tr" x="440" y="382" width="60" height="30" rx="3"/>
  <rect class="clip" x="500" y="382" width="70" height="30" rx="3"/>
  <line x1="440" y1="376" x2="440" y2="418" stroke="#f5a524" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text class="t lbl" x="330" y="434">Start on Edit</text>
  <text class="t s" x="330" y="452">deja respirar al plano que sale</text>

  <rect class="clip" x="590" y="382" width="70" height="30" rx="3"/>
  <rect class="tr" x="660" y="382" width="60" height="30" rx="3"/>
  <rect class="clip" x="720" y="382" width="110" height="30" rx="3"/>
  <line x1="720" y1="376" x2="720" y2="418" stroke="#f5a524" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text class="t lbl" x="590" y="434">End on Edit</text>
  <text class="t s" x="590" y="452">el plano nuevo llega nítido en el corte</text>
</svg>
