<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
     aria-label="El arbol de la Effects Library en tres secciones: Toolbox con las transiciones, titulos, generadores y la carpeta Effects donde vive el adjustment clip; Open FX con los filtros de ResolveFX repartidos en quince categorias; y Audio FX con los FairlightFX. Debajo, el parametro Blend que tienen todos los ResolveFX y el orden en el que se aplican los filtros.">
  <title>El árbol de la Effects Library</title>
  <style>
    .bg{fill:#101418}
    .card{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .box{fill:#232b34;stroke:#2f3a45;stroke-width:1}
    .t{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif}
    .h{font-size:15px;font-weight:600;fill:#e8eef4}
    .col{font-size:13px;font-weight:600;fill:#4a9eff}
    .lbl{font-size:13px;font-weight:600;fill:#e8eef4}
    .s{font-size:12px;fill:#93a1b0}
    .am{font-size:12px;font-weight:600;fill:#f5a524}
  </style>
  <rect class="bg" width="880" height="470"/>
  <text class="t h" x="40" y="34">Tres secciones. Los filtros están en Open FX, no en el Toolbox.</text>

  <rect class="card" x="40" y="56" width="250" height="216" rx="4"/>
  <text class="t col" x="60" y="80">Toolbox</text>
  <text class="t s" x="60" y="98">lo que viene con Resolve</text>
  <rect class="box" x="60" y="110" width="210" height="22" rx="2"/>
  <text class="t s" x="70" y="126">Video Transitions</text>
  <rect class="box" x="60" y="136" width="210" height="22" rx="2"/>
  <text class="t s" x="70" y="152">Audio Transitions</text>
  <rect class="box" x="60" y="162" width="210" height="22" rx="2"/>
  <text class="t s" x="70" y="178">Titles</text>
  <rect class="box" x="60" y="188" width="210" height="22" rx="2"/>
  <text class="t s" x="70" y="204">Generators</text>
  <rect class="box" x="60" y="214" width="210" height="22" rx="2"/>
  <text class="t s" x="70" y="230">Effects</text>
  <text class="t am" x="60" y="256">Effects no son filtros:</text>
  <text class="t am" x="60" y="268">aquí vive el Adjustment Clip</text>

  <rect class="card" x="300" y="56" width="410" height="216" rx="4"/>
  <text class="t col" x="320" y="80">Open FX</text>
  <text class="t s" x="320" y="98">los filtros · quince categorías de ResolveFX</text>
  <text class="t s" x="320" y="124">Blur</text>
  <text class="t s" x="410" y="124">Color</text>
  <text class="t s" x="510" y="124">Film Emulation</text>
  <text class="t s" x="640" y="124">Generate</text>
  <text class="t s" x="320" y="146">Key</text>
  <text class="t s" x="410" y="146">Light</text>
  <text class="t s" x="510" y="146">OpenColorIO</text>
  <text class="t s" x="640" y="146">Refine</text>
  <text class="t s" x="320" y="168">Revival</text>
  <text class="t s" x="410" y="168">Sharpen</text>
  <text class="t s" x="510" y="168">Stylize</text>
  <text class="t s" x="640" y="168">Temporal</text>
  <text class="t s" x="320" y="190">Texture</text>
  <text class="t s" x="410" y="190">Transform</text>
  <text class="t s" x="510" y="190">Warp</text>
  <text class="t s" x="320" y="216">se subdivide en Filters, Generators y Transitions</text>
  <text class="t am" x="320" y="240">muchos son de Studio: el manual los marca</text>
  <text class="t am" x="320" y="258">(Studio Version Only) en el título de cada efecto</text>

  <rect class="card" x="720" y="56" width="120" height="216" rx="4"/>
  <text class="t col" x="740" y="80">Audio FX</text>
  <text class="t s" x="740" y="104">FairlightFX</text>
  <text class="t s" x="740" y="126">VST</text>
  <text class="t s" x="740" y="148">Audio Units</text>
  <text class="t s" x="740" y="180">es la Fase 4:</text>
  <text class="t s" x="740" y="198">Semanas 13</text>
  <text class="t s" x="740" y="216">a 15</text>

  <line x1="40" y1="296" x2="840" y2="296" stroke="#2f3a45" stroke-width="1"/>

  <rect class="card" x="40" y="316" width="380" height="130" rx="4"/>
  <text class="t col" x="60" y="340">Blend · lo tienen TODOS</text>
  <rect class="box" x="60" y="352" width="340" height="20" rx="2"/>
  <rect x="60" y="352" width="204" height="20" fill="#4a9eff" opacity="0.35"/>
  <text class="t s" x="66" y="366">0</text>
  <text class="t s" x="386" y="366">1</text>
  <text class="t s" x="60" y="396">a 0 no se aplica nada · a 1 se aplica entero</text>
  <text class="t s" x="60" y="416">está al final de los parámetros de cada filtro</text>
  <text class="t am" x="60" y="438">si se nota demasiado, baja Blend; no toques sus valores</text>

  <rect class="card" x="440" y="316" width="400" height="130" rx="4"/>
  <text class="t col" x="460" y="340">EL ORDEN IMPORTA · Inspector &gt; Effects</text>
  <rect class="box" x="460" y="352" width="360" height="24" rx="2"/>
  <text class="t s" x="470" y="369">1 · Gaussian Blur</text>
  <text class="t s" x="690" y="369">subir · bajar · on/off</text>
  <rect class="box" x="460" y="382" width="360" height="24" rx="2"/>
  <text class="t s" x="470" y="399">2 · Edge Detect</text>
  <text class="t s" x="690" y="399">subir · bajar · on/off</text>
  <text class="t s" x="460" y="426">se aplican en cascada: el 2 trabaja sobre el resultado del 1</text>
  <text class="t am" x="460" y="440">cambiarlos de orden cambia el resultado</text>
</svg>
