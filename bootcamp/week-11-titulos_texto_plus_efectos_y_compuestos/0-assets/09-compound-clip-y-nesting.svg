<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
     aria-label="Un compound clip: cuatro clips de dos pistas empaquetados en un solo clip, con su control de ruta en la esquina inferior izquierda de la timeline para entrar y salir. Al lado, una timeline anidada, que es una timeline completa del proyecto editada dentro de otra y que existe tambien por separado. Debajo, el coste: un compuesto es un solo grado en la pagina Color.">
  <title>Compound clips y nesting</title>
  <style>
    .bg{fill:#101418}
    .card{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .clip{fill:#232b34;stroke:#2f3a45;stroke-width:1}
    .cmp{fill:#232b34;stroke:#a371f7;stroke-width:1.5}
    .nst{fill:#232b34;stroke:#3fb950;stroke-width:1.5}
    .t{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif}
    .h{font-size:15px;font-weight:600;fill:#e8eef4}
    .col{font-size:13px;font-weight:600;fill:#4a9eff}
    .vio{font-size:13px;font-weight:600;fill:#a371f7}
    .ver{font-size:13px;font-weight:600;fill:#3fb950}
    .lbl{font-size:13px;font-weight:600;fill:#e8eef4}
    .s{font-size:12px;fill:#93a1b0}
    .am{font-size:12px;font-weight:600;fill:#f5a524}
  </style>
  <rect class="bg" width="880" height="470"/>
  <text class="t h" x="40" y="34">Dos formas de tratar varios clips como uno, y no son la misma.</text>

  <rect class="card" x="40" y="56" width="400" height="230" rx="4"/>
  <text class="t vio" x="60" y="80">COMPOUND CLIP</text>

  <text class="t s" x="60" y="106">antes</text>
  <rect class="clip" x="110" y="92" width="70" height="22" rx="2"/>
  <rect class="clip" x="180" y="92" width="70" height="22" rx="2"/>
  <rect class="clip" x="250" y="92" width="70" height="22" rx="2"/>
  <rect class="clip" x="320" y="92" width="70" height="22" rx="2"/>
  <rect class="clip" x="150" y="118" width="120" height="22" rx="2"/>
  <text class="t s" x="60" y="134">V2</text>

  <text class="t s" x="60" y="172">después</text>
  <rect class="cmp" x="110" y="158" width="280" height="22" rx="2"/>
  <text class="t s" x="150" y="174">BC-Compuesto-Recuerdo</text>

  <text class="t s" x="60" y="206">al crearlo pasan dos cosas:</text>
  <text class="t s" x="60" y="224">1 · sustituye a los clips en la timeline</text>
  <text class="t s" x="60" y="242">2 · una copia cae en el BIN ACTIVO</text>
  <text class="t am" x="60" y="266">selecciona el bin ANTES de crearlo</text>

  <rect class="card" x="460" y="56" width="380" height="230" rx="4"/>
  <text class="t ver" x="480" y="80">TIMELINE ANIDADA</text>

  <rect class="nst" x="480" y="94" width="200" height="22" rx="2"/>
  <text class="t s" x="500" y="110">BC-Escena-02</text>
  <text class="t s" x="700" y="110">lleva su</text>
  <text class="t s" x="700" y="128">distintivo</text>

  <text class="t s" x="480" y="152">la timeline original existe aparte, en el media pool</text>
  <text class="t s" x="480" y="172">si la editas, la instancia anidada cambia</text>
  <text class="t am" x="480" y="196">si borras clips del original, esos tramos</text>
  <text class="t am" x="480" y="214">se ponen a NEGRO en la anidada:</text>
  <text class="t am" x="480" y="232">su duración no cambia</text>
  <text class="t s" x="480" y="260">Open in Timeline abre la original,</text>
  <text class="t s" x="480" y="278">y no hay control de ruta para volver</text>

  <line x1="40" y1="306" x2="840" y2="306" stroke="#2f3a45" stroke-width="1"/>

  <rect class="card" x="40" y="326" width="400" height="120" rx="4"/>
  <text class="t col" x="60" y="350">EL CONTROL DE RUTA</text>
  <rect class="clip" x="60" y="362" width="360" height="26" rx="2"/>
  <text class="t s" x="72" y="380">BC-Montaje-v5</text>
  <text class="t s" x="180" y="380">&gt;</text>
  <text class="t vio" x="200" y="380">BC-Compuesto-Recuerdo</text>
  <text class="t s" x="60" y="410">esquina inferior izquierda de la timeline</text>
  <text class="t am" x="60" y="432">dos nombres = estás DENTRO · doble clic en el de la izquierda</text>

  <rect class="card" x="460" y="326" width="380" height="120" rx="4"/>
  <text class="t col" x="480" y="350">LO QUE CUESTA EN LA FASE 5</text>
  <rect class="cmp" x="480" y="362" width="120" height="34" rx="2"/>
  <text class="t s" x="502" y="384">un solo grado</text>
  <rect class="clip" x="620" y="362" width="52" height="34" rx="2"/>
  <rect class="clip" x="676" y="362" width="52" height="34" rx="2"/>
  <rect class="clip" x="732" y="362" width="52" height="34" rx="2"/>
  <text class="t s" x="620" y="412">cuatro grados, si no lo empaquetas</text>
  <text class="t am" x="480" y="434">empaqueta lo que es una unidad, no lo que te estorba mirar</text>
</svg>
