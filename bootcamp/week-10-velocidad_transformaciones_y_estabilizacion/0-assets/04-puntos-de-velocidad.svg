<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img"
     aria-label="Una franja de retime con tres puntos de velocidad que parten el clip en tramos: el primero al cien por cien con flechas azules separadas, el segundo ralentizado con flechas amarillas muy separadas y el tercero acelerado con flechas azules juntas. Debajo, la diferencia entre el asa de arriba, que cambia la velocidad del tramo, y el asa de abajo, que reparte fotogramas entre tramos.">
  <title>Puntos de velocidad y sus dos asas</title>
  <style>
    .bg{fill:#101418}
    .card{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .clip{fill:#232b34;stroke:#2f3a45;stroke-width:1}
    .track{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .pop{fill:#232b34;stroke:#2f3a45;stroke-width:1}
    .t{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif}
    .h{font-size:15px;font-weight:600;fill:#e8eef4}
    .col{font-size:13px;font-weight:600;fill:#4a9eff}
    .lbl{font-size:13px;font-weight:600;fill:#e8eef4}
    .s{font-size:12px;fill:#93a1b0}
    .mini{font-size:12px;fill:#e8eef4}
    .am{font-size:12px;font-weight:600;fill:#f5a524}
  </style>
  <rect class="bg" width="880" height="430"/>
  <text class="t h" x="40" y="34">Un punto de velocidad separa dos tramos. Cada tramo va a lo suyo.</text>

  <text class="t col" x="40" y="70">UNA RAMPA DE TRES TRAMOS</text>

  <rect class="track" x="40" y="84" width="760" height="18" rx="2"/>
  <g fill="#4a9eff">
    <polygon points="56,88 66,93 56,98"/><polygon points="86,88 96,93 86,98"/><polygon points="116,88 126,93 116,98"/>
    <polygon points="146,88 156,93 146,98"/><polygon points="176,88 186,93 176,98"/><polygon points="206,88 216,93 206,98"/>
  </g>
  <g fill="#f5a524">
    <polygon points="260,88 270,93 260,98"/><polygon points="330,88 340,93 330,98"/><polygon points="400,88 410,93 400,98"/>
    <polygon points="470,88 480,93 470,98"/>
  </g>
  <g fill="#4a9eff">
    <polygon points="560,88 570,93 560,98"/><polygon points="578,88 588,93 578,98"/><polygon points="596,88 606,93 596,98"/>
    <polygon points="614,88 624,93 614,98"/><polygon points="632,88 642,93 632,98"/><polygon points="650,88 660,93 650,98"/>
    <polygon points="668,88 678,93 668,98"/><polygon points="686,88 696,93 686,98"/><polygon points="704,88 714,93 704,98"/>
    <polygon points="722,88 732,93 722,98"/><polygon points="740,88 750,93 740,98"/><polygon points="758,88 768,93 758,98"/>
  </g>

  <line x1="240" y1="78" x2="240" y2="146" stroke="#e8eef4" stroke-width="2"/>
  <line x1="540" y1="78" x2="540" y2="146" stroke="#e8eef4" stroke-width="2"/>
  <rect x="234" y="72" width="12" height="8" rx="2" fill="#e8eef4"/>
  <rect x="534" y="72" width="12" height="8" rx="2" fill="#e8eef4"/>
  <rect x="234" y="146" width="12" height="8" rx="2" fill="#93a1b0"/>
  <rect x="534" y="146" width="12" height="8" rx="2" fill="#93a1b0"/>

  <rect class="clip" x="40" y="104" width="760" height="42" rx="3"/>
  <rect class="pop" x="110" y="116" width="70" height="20" rx="3"/>
  <text class="t mini" x="126" y="130">100 %</text>
  <rect class="pop" x="355" y="116" width="70" height="20" rx="3"/>
  <text class="t mini" x="374" y="130">40 %</text>
  <rect class="pop" x="635" y="116" width="70" height="20" rx="3"/>
  <text class="t mini" x="648" y="130">200 %</text>

  <text class="t s" x="40" y="176">flechas azules separadas por igual</text>
  <text class="t s" x="300" y="176">amarillas y muy separadas</text>
  <text class="t s" x="600" y="176">azules muy juntas</text>
  <text class="t am" x="40" y="196">El paso de un tramo al siguiente se suaviza solo. Con dos velocidades dentro, el audio del clip queda silenciado.</text>

  <line x1="40" y1="216" x2="840" y2="216" stroke="#2f3a45" stroke-width="1"/>

  <text class="t col" x="40" y="244">LAS DOS ASAS DE UN PUNTO, QUE NO HACEN LO MISMO</text>

  <rect class="card" x="40" y="258" width="390" height="140" rx="4"/>
  <rect x="200" y="278" width="12" height="8" rx="2" fill="#e8eef4"/>
  <line x1="206" y1="286" x2="206" y2="330" stroke="#e8eef4" stroke-width="2"/>
  <text class="t lbl" x="60" y="312">asa de ARRIBA</text>
  <text class="t s" x="60" y="352">Cambia la velocidad del tramo que tiene</text>
  <text class="t s" x="60" y="370">a su izquierda. A la derecha lo ralentiza,</text>
  <text class="t s" x="60" y="388">a la izquierda lo acelera.</text>

  <rect class="card" x="450" y="258" width="390" height="140" rx="4"/>
  <line x1="616" y1="278" x2="616" y2="322" stroke="#93a1b0" stroke-width="2"/>
  <rect x="610" y="322" width="12" height="8" rx="2" fill="#93a1b0"/>
  <text class="t lbl" x="470" y="312">asa de ABAJO</text>
  <text class="t s" x="470" y="352">Cambia qué trozo del plano ocupa ese</text>
  <text class="t s" x="470" y="370">tramo, sin tocar su velocidad. Reparte</text>
  <text class="t s" x="470" y="388">fotogramas con los tramos vecinos.</text>
</svg>
