<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"
     aria-label="Escala de decibelios a fondo de escala con el cero arriba como techo absoluto. La zona de dialogo esta entre menos doce y menos seis, la de ambiente y recursos por debajo de menos veinticuatro. A la derecha, una senal que intenta pasar del cero se aplana contra el techo: es el recorte, y no se puede deshacer.">
  <title>La escala de dBFS y el techo del recorte</title>
  <style>
    .bg{fill:#101418}.surf{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .scale{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .dial{fill:#232b34;stroke:#3fb950;stroke-width:2}
    .amb{fill:#232b34;stroke:#4a9eff;stroke-width:2}
    .clip{fill:#232b34;stroke:#f85149;stroke-width:2}
    .t{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif}
    .h{font-size:15px;font-weight:600;fill:#e8eef4}
    .lbl{font-size:13px;font-weight:600;fill:#e8eef4}
    .s{font-size:12px;fill:#93a1b0}
    .er{font-size:12px;font-weight:600;fill:#f85149}
    .ok{font-size:12px;font-weight:600;fill:#3fb950}
  </style>
  <rect class="bg" width="880" height="400"/>
  <text class="t h" x="40" y="36">En dBFS el 0 no es el centro: es el techo. Todo lo demás es negativo.</text>

  <rect class="surf" x="40" y="58" width="400" height="300" rx="6"/>
  <rect x="120" y="86" width="240" height="4" fill="#f85149"/>
  <text class="t er" x="60" y="92">0 dBFS</text>
  <text class="t s" x="120" y="110">máximo absoluto · por encima no hay nada</text>

  <rect class="dial" x="120" y="140" width="240" height="60" rx="3"/>
  <text class="t s" x="60" y="150">-6</text>
  <text class="t s" x="60" y="200">-12</text>
  <text class="t ok" x="136" y="176">diálogo · picos entre -12 y -6</text>

  <rect class="amb" x="120" y="250" width="240" height="52" rx="3"/>
  <text class="t s" x="60" y="258">-24</text>
  <text class="t s" x="136" y="280">ambiente y recursos bajo la voz</text>

  <text class="t s" x="60" y="336">Cuanto más negativo, más bajo.</text>

  <rect class="surf" x="460" y="58" width="380" height="300" rx="6"/>
  <text class="t lbl" x="482" y="86">Qué es el recorte (clipping)</text>
  <rect x="482" y="110" width="336" height="4" fill="#f85149"/>
  <text class="t er" x="482" y="104">0 dBFS</text>
  <path d="M 482 220 Q 520 130 560 220 Q 600 300 640 220 Q 660 118 700 220 Q 740 300 780 220"
        fill="none" stroke="#93a1b0" stroke-width="2"/>
  <rect class="clip" x="512" y="114" width="60" height="14" rx="2"/>
  <rect class="clip" x="652" y="114" width="60" height="14" rx="2"/>
  <text class="t er" x="482" y="290">Los picos que no caben se aplanan.</text>
  <text class="t s" x="482" y="312">Suena a distorsión áspera, y la información</text>
  <text class="t s" x="482" y="330">ya no está en el archivo: bajarlo después</text>
  <text class="t s" x="482" y="348">lo deja bajo y distorsionado.</text>
</svg>
