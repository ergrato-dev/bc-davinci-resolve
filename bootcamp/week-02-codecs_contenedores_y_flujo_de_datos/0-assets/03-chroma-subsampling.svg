<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img"
     aria-label="Tres rejillas de ocho pixeles, dos filas por cuatro columnas. En 4:4:4 cada pixel tiene su propia muestra de color. En 4:2:2 solo la tienen las columnas alternas. En 4:2:0 solo un pixel de cada bloque de dos por dos. En las tres, todos los pixeles conservan su muestra de brillo.">
  <title>Chroma subsampling 4:4:4, 4:2:2 y 4:2:0</title>
  <style>
    .bg   { fill: #101418; }
    .surf { fill: #191f26; stroke: #2f3a45; stroke-width: 1; }
    .surf2{ fill: #232b34; stroke: #2f3a45; stroke-width: 1; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #e8eef4; }
    .s    { font-size: 12px; fill: #93a1b0; }
    .lbl  { font-size: 13px; font-weight: 600; fill: #e8eef4; }
    .mono { font-size: 12px; fill: #93a1b0; }
    .rail { stroke: #2f3a45; stroke-width: 1; }
  </style>

  <rect class="bg" width="880" height="340"/>
  <text class="t h" x="40" y="38">Cuantas muestras de color hay por cada 8 pixeles</text>
  <text class="t s" x="40" y="58">El brillo se guarda siempre entero: una muestra por pixel. Lo que se recorta es el color</text>
  <text class="t lbl" x="60" y="88">4:4:4</text>
  <text class="t s"   x="60" y="106">100 % del color  ·  una muestra por pixel</text>
