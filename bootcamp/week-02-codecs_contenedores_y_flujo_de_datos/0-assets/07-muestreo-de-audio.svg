  <text class="t lbl" x="62" y="358">Horizontal: frecuencia de muestreo</text>
  <text class="t s"   x="62" y="380">Cada cuanto se mide la onda. 48 000 veces por</text>
  <text class="t s"   x="62" y="398">segundo en todo el video profesional: 48 kHz.</text>
  <text class="t s"   x="62" y="416">Hay que muestrear a mas del doble de la frecuencia mas alta.</text>
  <rect class="surf" x="448" y="332" width="392" height="98" rx="6"/>
  <text class="t lbl" x="470" y="358">Vertical: profundidad de bits</text>
  <text class="t s"   x="470" y="380">Con cuanta precision se anota cada medida.</text>
  <text class="t s"   x="470" y="398">16 bits para entregar, 24 para grabar y trabajar.</text>
  <text class="t s"   x="470" y="416">Los escalones que faltan se oyen como ruido de fondo.</text>
