<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img"
     aria-label="Una onda continua recorre el grafico. Sobre ella caen treinta y una medidas verticales regulares que solo pueden apoyarse en unas pocas alturas marcadas por lineas discontinuas. El eje horizontal corresponde a la frecuencia de muestreo, cuantas medidas se toman por segundo, y el vertical a la profundidad de bits, con cuanta precision se anota cada medida.">
  <title>Muestreo y cuantizacion de una onda de audio</title>
