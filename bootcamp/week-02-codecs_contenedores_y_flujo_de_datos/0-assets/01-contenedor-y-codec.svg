<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"
     aria-label="Un contenedor dibujado como una caja que guarda dentro cuatro pistas: video comprimido con H.264, audio comprimido con AAC, subtitulos y metadata. A la derecha, la definicion de codec y de contenedor, y la nota de que remuxear cambia la caja sin tocar las pistas.">
  <title>Un contenedor y los codecs de sus pistas</title>
  <style>
    .bg   { fill: #101418; }
    .surf { fill: #191f26; stroke: #2f3a45; stroke-width: 1; }
    .surf2{ fill: #232b34; stroke: #2f3a45; stroke-width: 1; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #e8eef4; }
    .s    { font-size: 12px; fill: #93a1b0; }
    .lbl  { font-size: 13px; font-weight: 600; fill: #e8eef4; }
    .mono { font-size: 12px; fill: #93a1b0; }
    .rail { stroke: #2f3a45; stroke-width: 1; }
  </style>

  <rect class="bg" width="880" height="400"/>
  <text class="t h" x="40" y="38">Un contenedor guarda pistas; cada pista tiene su codec</text>
  <text class="t s" x="40" y="58">La extension del archivo describe la caja. Lo de dentro puede ser cualquier cosa</text>
  <rect class="surf" x="40" y="82" width="500" height="288" rx="6"/>
  <text class="t lbl" x="60" y="110">Contenedor  ·  archivo .mp4</text>
  <text class="t s"   x="60" y="130">Resolve lo identifica como Format: QuickTime</text>
  <rect class="surf2" x="62" y="148" width="456" height="46" rx="4"/>
  <rect x="62" y="148" width="5" height="46" fill="#4a9eff"/>
  <text class="t lbl" x="82" y="168">Pista de video</text>
  <text class="t s"   x="82" y="185">H.264 High L4.2</text>
  <rect class="surf2" x="62" y="204" width="456" height="46" rx="4"/>
  <rect x="62" y="204" width="5" height="46" fill="#3fb950"/>
  <text class="t lbl" x="82" y="224">Pista de audio</text>
  <text class="t s"   x="82" y="241">AAC  ·  48 000 Hz  ·  2 canales</text>
  <rect class="surf2" x="62" y="260" width="456" height="46" rx="4"/>
  <rect x="62" y="260" width="5" height="46" fill="#a371f7"/>
  <text class="t lbl" x="82" y="280">Subtitulos</text>
  <text class="t s"   x="82" y="297">texto temporizado, si los hay</text>
  <rect class="surf2" x="62" y="316" width="456" height="46" rx="4"/>
  <rect x="62" y="316" width="5" height="46" fill="#f5a524"/>
  <text class="t lbl" x="82" y="336">Metadata e indice</text>
  <text class="t s"   x="82" y="353">fecha, camara, timecode, orientacion</text>
  <line class="rail" x1="570" y1="100" x2="570" y2="360"/>
  <text class="t lbl" x="596" y="112">Codec</text>
  <text class="t s"   x="596" y="134">El metodo con el que se</text>
  <text class="t s"   x="596" y="151">comprimio esa pista concreta.</text>
  <text class="t s"   x="596" y="168">Un archivo puede llevar varios</text>
  <text class="t s"   x="596" y="185">codecs distintos a la vez.</text>
  <text class="t lbl" x="596" y="222">Contenedor</text>
  <text class="t s"   x="596" y="244">La estructura que ordena las</text>
  <text class="t s"   x="596" y="261">pistas y dice donde empieza</text>
  <text class="t s"   x="596" y="278">cada frame. No comprime nada.</text>
  <rect class="surf2" x="596" y="300" width="244" height="60" rx="4"/>
  <text class="t s" x="612" y="322">Cambiar de caja sin tocar las</text>
  <text class="t s" x="612" y="340">pistas se llama remuxear: es</text>
  <text class="t s" x="612" y="352">rapido y no pierde calidad.</text>
</svg>
