<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img"
     aria-label="Un grafico con la luz que llega al sensor en el eje horizontal y el valor guardado en el vertical. Una linea discontinua recta representa la respuesta lineal del sensor. Una curva azul, Rec.709, sube desde el cero con el contraste ya aplicado. Una curva ambar, log, arranca por encima del cero y se aplana antes, reservando rango para las altas luces: por eso el material log se ve lavado.">
  <title>Curvas de transferencia: lineal, Rec.709 y log</title>
  <style>
    .bg   { fill: #101418; }
    .surf { fill: #191f26; stroke: #2f3a45; stroke-width: 1; }
    .surf2{ fill: #232b34; stroke: #2f3a45; stroke-width: 1; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #e8eef4; }
    .s    { font-size: 12px; fill: #93a1b0; }
    .lbl  { font-size: 13px; font-weight: 600; fill: #e8eef4; }
    .mono { font-size: 12px; fill: #93a1b0; }
    .rail { stroke: #2f3a45; stroke-width: 1; }
  </style>

  <rect class="bg" width="880" height="450"/>
  <text class="t h" x="40" y="38">Tres formas de repartir los numeros entre la sombra y el cielo</text>
  <text class="t s" x="40" y="58">La curva decide cuanta luz de la escena corresponde a cada valor guardado</text>
  <line class="rail" x1="110" y1="350" x2="830" y2="350"/>
  <line class="rail" x1="110" y1="350" x2="110" y2="80"/>
  <line x1="110" y1="282" x2="830" y2="282" stroke="#2f3a45" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="110" y1="215" x2="830" y2="215" stroke="#2f3a45" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="110" y1="148" x2="830" y2="148" stroke="#2f3a45" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="110" y1="80" x2="830" y2="80" stroke="#2f3a45" stroke-width="1" stroke-dasharray="3 6"/>
  <text class="t s" x="110" y="372">sombra</text>
  <text class="t s" x="830" y="372" text-anchor="end">alta luz</text>
  <text class="t s" x="40" y="84">valor</text>
  <text class="t s" x="40" y="100">guardado</text>
  <text class="t s" x="470" y="392" text-anchor="middle">luz que llega al sensor</text>
