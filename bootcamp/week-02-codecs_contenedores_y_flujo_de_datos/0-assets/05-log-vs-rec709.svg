  <text class="t lbl" x="824" y="82" text-anchor="end" fill="#4a9eff">Rec.709</text>
  <text class="t s"   x="824" y="100" text-anchor="end">contraste ya aplicado: se ve bien al abrirlo</text>
  <text class="t lbl" x="824" y="163" text-anchor="end" fill="#f5a524">Log</text>
  <text class="t s"   x="824" y="181" text-anchor="end">negros levantados y blancos contenidos: se ve lavado</text>
  <text class="t lbl" x="126" y="334" fill="#93a1b0">Lineal (lo que mide el sensor, antes de revelar)</text>
  <rect class="surf" x="40" y="382" width="800" height="52" rx="6"/>
  <text class="t s" x="62" y="404">El log no esta estropeado: guarda mas rango a cambio de no estar listo para mirarse.</text>
  <text class="t s" x="62" y="422">Se convierte a Rec.709 con una LUT o con la gestion de color del proyecto (Semana 16).</text>
</svg>
