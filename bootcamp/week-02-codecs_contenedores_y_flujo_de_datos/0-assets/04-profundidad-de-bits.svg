<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img"
     aria-label="Dos barras horizontales de gris que van de oscuro a claro. La de arriba esta construida con diez escalones y las franjas se distinguen a simple vista. La de abajo usa cuarenta escalones y la transicion se percibe continua. Debajo, la comparacion entre 8 bits, con 256 tonos por canal, y 10 bits, con 1024.">
  <title>Banding: el mismo degradado con distinta profundidad de bits</title>
  <style>
    .bg   { fill: #101418; }
    .surf { fill: #191f26; stroke: #2f3a45; stroke-width: 1; }
    .surf2{ fill: #232b34; stroke: #2f3a45; stroke-width: 1; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #e8eef4; }
    .s    { font-size: 12px; fill: #93a1b0; }
    .lbl  { font-size: 13px; font-weight: 600; fill: #e8eef4; }
    .mono { font-size: 12px; fill: #93a1b0; }
    .rail { stroke: #2f3a45; stroke-width: 1; }
  </style>

  <rect class="bg" width="880" height="410"/>
  <text class="t h" x="40" y="38">El mismo degradado con pocos y con muchos escalones</text>
  <text class="t s" x="40" y="58">Cuantos menos tonos disponibles, mas ancha es cada franja y antes se ve</text>
  <text class="t lbl" x="40" y="108">Pocos tonos</text>
  <text class="t s"   x="40" y="126">los escalones se ven: eso es banding</text>
  <rect x="250.00" y="94" width="59.60" height="56" fill="#181818"/>
