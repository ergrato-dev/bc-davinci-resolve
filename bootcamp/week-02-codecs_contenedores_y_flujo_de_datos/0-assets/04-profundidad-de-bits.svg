  <rect class="surf" x="40" y="300" width="800" height="92" rx="6"/>
  <text class="t lbl" x="66" y="326">8 bits = 256 tonos por canal</text>
  <text class="t s"   x="66" y="346">Movil, camara de consumo, H.264, casi todo internet</text>
  <text class="t s"   x="66" y="366">Aguanta poco etalonaje: subir contraste separa escalones que ya existian</text>
  <text class="t lbl" x="470" y="326">10 bits = 1024 tonos por canal</text>
  <text class="t s"   x="470" y="346">ProRes 422, DNxHR, camaras recientes, HDR</text>
  <text class="t s"   x="470" y="366">Cuatro veces mas margen para corregir sin romper el degradado</text>
