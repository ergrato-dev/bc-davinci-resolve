<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img"
     aria-label="Arriba, una tira de seis frames numerados en los que un punto avanza de izquierda a derecha; entre cada par de frames se indica que pasan 41,7 milisegundos que no se graban. Abajo, el resultado percibido: un trazo continuo con una estela, con la nota de que el movimiento lo construye la percepción.">
  <title>De frames sueltos a movimiento percibido</title>
  <style>
    .bg    { fill: #101418; }
    .surf  { fill: #191f26; stroke: #2f3a45; stroke-width: 1; }
    .t     { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h     { font-size: 15px; font-weight: 600; fill: #e8eef4; }
    .s     { font-size: 12px; fill: #93a1b0; }
    .n     { font-size: 12px; font-weight: 600; fill: #93a1b0; }
    .dot   { fill: #4a9eff; }
    .gap   { stroke: #f5a524; stroke-width: 1; stroke-dasharray: 3 3; }
    .edge  { stroke: #2f3a45; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f3a45"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="340"/>

  <text class="t h" x="40" y="38">Lo que hay en el archivo: seis imágenes fijas</text>
  <text class="t s" x="40" y="58">Entre frame y frame, a 24 fps, pasan 41,7 ms de realidad que nadie grabó</text>

  <!-- Tira de frames -->
  <g>
    <rect class="surf" x="40"  y="76" width="118" height="82" rx="4"/>
    <circle class="dot" cx="60"  cy="117" r="7"/>
    <text class="t n" x="99"  y="150" text-anchor="middle">frame 1</text>

    <rect class="surf" x="176" y="76" width="118" height="82" rx="4"/>
    <circle class="dot" cx="216" cy="117" r="7"/>
    <text class="t n" x="235" y="150" text-anchor="middle">frame 2</text>

    <rect class="surf" x="312" y="76" width="118" height="82" rx="4"/>
    <circle class="dot" cx="372" cy="117" r="7"/>
    <text class="t n" x="371" y="150" text-anchor="middle">frame 3</text>

    <rect class="surf" x="448" y="76" width="118" height="82" rx="4"/>
    <circle class="dot" cx="528" cy="117" r="7"/>
    <text class="t n" x="507" y="150" text-anchor="middle">frame 4</text>

    <rect class="surf" x="584" y="76" width="118" height="82" rx="4"/>
    <circle class="dot" cx="664" cy="117" r="7"/>
    <text class="t n" x="643" y="150" text-anchor="middle">frame 5</text>

    <rect class="surf" x="720" y="76" width="118" height="82" rx="4"/>
    <circle class="dot" cx="820" cy="117" r="7"/>
    <text class="t n" x="779" y="150" text-anchor="middle">frame 6</text>
  </g>

  <!-- Huecos no grabados -->
  <g>
    <line class="gap" x1="167" y1="76" x2="167" y2="158"/>
    <line class="gap" x1="303" y1="76" x2="303" y2="158"/>
    <line class="gap" x1="439" y1="76" x2="439" y2="158"/>
    <line class="gap" x1="575" y1="76" x2="575" y2="158"/>
    <line class="gap" x1="711" y1="76" x2="711" y2="158"/>
  </g>
  <text class="t s" x="167" y="176" text-anchor="middle" fill="#f5a524">41,7 ms sin grabar</text>

  <line class="edge" x1="440" y1="196" x2="440" y2="228" marker-end="url(#a)"/>

  <!-- Resultado percibido -->
  <text class="t h" x="40" y="262">Lo que percibe el cerebro: un objeto que se desplaza</text>

  <rect class="surf" x="40" y="278" width="798" height="42" rx="4"/>
  <g>
    <circle cx="60"  cy="299" r="6" fill="#4a9eff" opacity="0.25"/>
    <circle cx="216" cy="299" r="6" fill="#4a9eff" opacity="0.4"/>
    <circle cx="372" cy="299" r="6" fill="#4a9eff" opacity="0.55"/>
    <circle cx="528" cy="299" r="6" fill="#4a9eff" opacity="0.7"/>
    <circle cx="664" cy="299" r="6" fill="#4a9eff" opacity="0.85"/>
    <circle cx="820" cy="299" r="7" fill="#4a9eff"/>
    <line x1="60" y1="299" x2="820" y2="299" stroke="#4a9eff" stroke-width="2" opacity="0.35"/>
  </g>
</svg>
