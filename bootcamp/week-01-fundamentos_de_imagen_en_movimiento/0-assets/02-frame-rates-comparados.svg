<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"
     aria-label="Cinco líneas de tiempo apiladas que representan un mismo segundo muestreado a 24, 25, 30, 50 y 60 frames por segundo. Cada línea muestra marcas equiespaciadas: cuantos más frames por segundo, más juntas están las marcas y menos tiempo pasa sin grabar entre ellas.">
  <title>Un mismo segundo a 24, 25, 30, 50 y 60 fps</title>
  <style>
    .bg    { fill: #101418; }
    .surf  { fill: #191f26; stroke: #2f3a45; stroke-width: 1; }
    .t     { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h     { font-size: 15px; font-weight: 600; fill: #e8eef4; }
    .s     { font-size: 12px; fill: #93a1b0; }
    .lbl   { font-size: 13px; font-weight: 600; fill: #e8eef4; }
    .tick  { stroke: #4a9eff; stroke-width: 2; }
    .rail  { stroke: #2f3a45; stroke-width: 1; }
  </style>

  <rect class="bg" width="880" height="400"/>

  <text class="t h" x="40" y="38">Un segundo, muestreado a distintas cadencias</text>
  <text class="t s" x="40" y="58">Cada marca es un frame. Más marcas, menos tiempo sin grabar entre ellas — y más datos</text>

  <!-- 24 fps -->
  <text class="t lbl" x="40" y="105">24 fps</text>
  <text class="t s"   x="40" y="122">41,7 ms</text>
  <line class="rail" x1="150" y1="100" x2="840" y2="100"/>
  <g class="tick">
    <line x1="150" y1="88" x2="150" y2="112"/><line x1="180" y1="88" x2="180" y2="112"/><line x1="210" y1="88" x2="210" y2="112"/>
    <line x1="240" y1="88" x2="240" y2="112"/><line x1="270" y1="88" x2="270" y2="112"/><line x1="300" y1="88" x2="300" y2="112"/>
    <line x1="330" y1="88" x2="330" y2="112"/><line x1="360" y1="88" x2="360" y2="112"/><line x1="390" y1="88" x2="390" y2="112"/>
    <line x1="420" y1="88" x2="420" y2="112"/><line x1="450" y1="88" x2="450" y2="112"/><line x1="480" y1="88" x2="480" y2="112"/>
    <line x1="510" y1="88" x2="510" y2="112"/><line x1="540" y1="88" x2="540" y2="112"/><line x1="570" y1="88" x2="570" y2="112"/>
    <line x1="600" y1="88" x2="600" y2="112"/><line x1="630" y1="88" x2="630" y2="112"/><line x1="660" y1="88" x2="660" y2="112"/>
    <line x1="690" y1="88" x2="690" y2="112"/><line x1="720" y1="88" x2="720" y2="112"/><line x1="750" y1="88" x2="750" y2="112"/>
    <line x1="780" y1="88" x2="780" y2="112"/><line x1="810" y1="88" x2="810" y2="112"/><line x1="840" y1="88" x2="840" y2="112"/>
  </g>

  <!-- 25 fps -->
  <text class="t lbl" x="40" y="165">25 fps</text>
  <text class="t s"   x="40" y="182">40,0 ms</text>
  <line class="rail" x1="150" y1="160" x2="840" y2="160"/>
  <g class="tick">
    <line x1="150" y1="148" x2="150" y2="172"/><line x1="178" y1="148" x2="178" y2="172"/><line x1="207" y1="148" x2="207" y2="172"/>
    <line x1="236" y1="148" x2="236" y2="172"/><line x1="265" y1="148" x2="265" y2="172"/><line x1="294" y1="148" x2="294" y2="172"/>
    <line x1="322" y1="148" x2="322" y2="172"/><line x1="351" y1="148" x2="351" y2="172"/><line x1="380" y1="148" x2="380" y2="172"/>
    <line x1="409" y1="148" x2="409" y2="172"/><line x1="438" y1="148" x2="438" y2="172"/><line x1="466" y1="148" x2="466" y2="172"/>
    <line x1="495" y1="148" x2="495" y2="172"/><line x1="524" y1="148" x2="524" y2="172"/><line x1="553" y1="148" x2="553" y2="172"/>
    <line x1="582" y1="148" x2="582" y2="172"/><line x1="610" y1="148" x2="610" y2="172"/><line x1="639" y1="148" x2="639" y2="172"/>
    <line x1="668" y1="148" x2="668" y2="172"/><line x1="697" y1="148" x2="697" y2="172"/><line x1="726" y1="148" x2="726" y2="172"/>
    <line x1="754" y1="148" x2="754" y2="172"/><line x1="783" y1="148" x2="783" y2="172"/><line x1="812" y1="148" x2="812" y2="172"/>
    <line x1="840" y1="148" x2="840" y2="172"/>
  </g>

  <!-- 30 fps -->
  <text class="t lbl" x="40" y="225">30 fps</text>
  <text class="t s"   x="40" y="242">33,3 ms</text>
  <line class="rail" x1="150" y1="220" x2="840" y2="220"/>
  <g class="tick">
    <line x1="150" y1="208" x2="150" y2="232"/><line x1="174" y1="208" x2="174" y2="232"/><line x1="198" y1="208" x2="198" y2="232"/>
    <line x1="222" y1="208" x2="222" y2="232"/><line x1="246" y1="208" x2="246" y2="232"/><line x1="269" y1="208" x2="269" y2="232"/>
    <line x1="293" y1="208" x2="293" y2="232"/><line x1="317" y1="208" x2="317" y2="232"/><line x1="341" y1="208" x2="341" y2="232"/>
    <line x1="365" y1="208" x2="365" y2="232"/><line x1="388" y1="208" x2="388" y2="232"/><line x1="412" y1="208" x2="412" y2="232"/>
    <line x1="436" y1="208" x2="436" y2="232"/><line x1="460" y1="208" x2="460" y2="232"/><line x1="484" y1="208" x2="484" y2="232"/>
    <line x1="507" y1="208" x2="507" y2="232"/><line x1="531" y1="208" x2="531" y2="232"/><line x1="555" y1="208" x2="555" y2="232"/>
    <line x1="579" y1="208" x2="579" y2="232"/><line x1="603" y1="208" x2="603" y2="232"/><line x1="626" y1="208" x2="626" y2="232"/>
    <line x1="650" y1="208" x2="650" y2="232"/><line x1="674" y1="208" x2="674" y2="232"/><line x1="698" y1="208" x2="698" y2="232"/>
    <line x1="722" y1="208" x2="722" y2="232"/><line x1="745" y1="208" x2="745" y2="232"/><line x1="769" y1="208" x2="769" y2="232"/>
    <line x1="793" y1="208" x2="793" y2="232"/><line x1="817" y1="208" x2="817" y2="232"/><line x1="840" y1="208" x2="840" y2="232"/>
  </g>

  <!-- 50 fps: barras densas dibujadas como bloque -->
  <text class="t lbl" x="40" y="285">50 fps</text>
  <text class="t s"   x="40" y="302">20,0 ms</text>
  <line class="rail" x1="150" y1="280" x2="840" y2="280"/>
  <rect x="150" y="268" width="690" height="24" fill="none" stroke="#4a9eff" stroke-width="2"
        stroke-dasharray="2 12.08"/>

  <!-- 60 fps -->
  <text class="t lbl" x="40" y="345">60 fps</text>
  <text class="t s"   x="40" y="362">16,7 ms</text>
  <line class="rail" x1="150" y1="340" x2="840" y2="340"/>
  <rect x="150" y="328" width="690" height="24" fill="none" stroke="#4a9eff" stroke-width="2"
        stroke-dasharray="2 9.69"/>

  <text class="t s" x="150" y="388">0 s</text>
  <text class="t s" x="840" y="388" text-anchor="end">1 s</text>
</svg>
