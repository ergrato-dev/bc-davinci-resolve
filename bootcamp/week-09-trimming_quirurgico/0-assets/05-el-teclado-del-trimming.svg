<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
     aria-label="Las teclas del trimming agrupadas en cuatro bloques. Bloque de modo: A para selection mode, T para trim edit mode, W para dynamic trim mode y S para alternar entre slip y slide. Bloque de seleccion: V selecciona el corte mas cercano, Shift mas V selecciona el clip que cruza el cabezal, U rota entre las tres partes del corte y Alt mas U elige si trimas video, audio o los dos. Bloque de movimiento: coma y punto mueven un fotograma, Shift mas coma y Shift mas punto mueven cinco. Bloque de escucha: barra inclinada reproduce alrededor de la seleccion y Ctrl mas barra activa el bucle. Debajo, el ciclo de seis pasos: modo, seleccion, que parte, mover, escuchar, siguiente corte.">
  <title>El teclado del trimming</title>
  <style>
    .bg{fill:#101418}
    .card{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .key{fill:#232b34;stroke:#4a9eff;stroke-width:2}
    .t{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif}
    .h{font-size:15px;font-weight:600;fill:#e8eef4}
    .col{font-size:13px;font-weight:600;fill:#4a9eff}
    .k{font-size:14px;font-weight:600;fill:#e8eef4}
    .s{font-size:12px;fill:#93a1b0}
    .lbl{font-size:13px;font-weight:600;fill:#e8eef4}
  </style>
  <rect class="bg" width="880" height="470"/>
  <text class="t h" x="40" y="32">Nueve teclas hacen el 90 % del trimming.</text>

  <rect class="card" x="40" y="52" width="390" height="150" rx="4"/>
  <text class="t col" x="60" y="76">1 · MODO</text>
  <rect class="key" x="60" y="88" width="40" height="30" rx="4"/><text class="t k" x="75" y="108">A</text>
  <text class="t s" x="112" y="108">Selection Mode · mover y redimensionar</text>
  <rect class="key" x="60" y="124" width="40" height="30" rx="4"/><text class="t k" x="76" y="144">T</text>
  <text class="t s" x="112" y="144">Trim Edit Mode · ripple, slip y slide</text>
  <rect class="key" x="60" y="160" width="40" height="30" rx="4"/><text class="t k" x="73" y="180">W</text>
  <text class="t s" x="112" y="180">Dynamic Trim Mode · trimar reproduciendo</text>

  <rect class="card" x="450" y="52" width="390" height="150" rx="4"/>
  <text class="t col" x="470" y="76">2 · SELECCIÓN</text>
  <rect class="key" x="470" y="88" width="40" height="30" rx="4"/><text class="t k" x="486" y="108">V</text>
  <text class="t s" x="522" y="108">el corte más cercano, y el cabezal va ahí</text>
  <rect class="key" x="470" y="124" width="76" height="30" rx="4"/><text class="t k" x="481" y="144">⇧+V</text>
  <text class="t s" x="558" y="144">el clip que cruza el cabezal</text>
  <rect class="key" x="470" y="160" width="40" height="30" rx="4"/><text class="t k" x="486" y="180">S</text>
  <text class="t s" x="522" y="180">alterna Slip y Slide con un clip elegido</text>

  <rect class="card" x="40" y="214" width="390" height="118" rx="4"/>
  <text class="t col" x="60" y="238">3 · QUÉ PARTE</text>
  <rect class="key" x="60" y="250" width="40" height="30" rx="4"/><text class="t k" x="76" y="270">U</text>
  <text class="t s" x="112" y="270">saliente → centrado → entrante</text>
  <rect class="key" x="60" y="286" width="86" height="30" rx="4"/><text class="t k" x="70" y="306">Alt+U</text>
  <text class="t s" x="158" y="306">vídeo+audio → solo vídeo → solo audio</text>

  <rect class="card" x="450" y="214" width="390" height="118" rx="4"/>
  <text class="t col" x="470" y="238">4 · MOVER Y ESCUCHAR</text>
  <rect class="key" x="470" y="250" width="66" height="30" rx="4"/><text class="t k" x="493" y="270">, .</text>
  <text class="t s" x="548" y="270">un fotograma · con ⇧, cinco</text>
  <rect class="key" x="470" y="286" width="40" height="30" rx="4"/><text class="t k" x="486" y="306">/</text>
  <text class="t s" x="522" y="306">reproduce alrededor de la selección</text>

  <rect class="card" x="40" y="344" width="800" height="106" rx="4"/>
  <text class="t lbl" x="60" y="370">El ciclo, siempre el mismo</text>
  <text class="t s" x="60" y="396">1 · modo con A o T   →   2 · selección con V o ⇧+V   →   3 · qué parte con U y Alt+U</text>
  <text class="t s" x="60" y="418">4 · mover con , y .   →   5 · escuchar con /   →   6 · flecha abajo al corte siguiente</text>
  <text class="t s" x="60" y="440">En Mac, Alt es Opt y Ctrl es Cmd. Comprueba los tuyos en Keyboard Customization.</text>
</svg>
