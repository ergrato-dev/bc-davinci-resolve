<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"
     aria-label="El mismo gesto en los dos modos. Arrastrar el borde de un clip en modo seleccion lo redimensiona y deja un hueco; en modo trim lo ripplea y trae hacia la izquierda todo lo que venia detras. Arrastrar el cuerpo de un clip en modo seleccion lo mueve dejando hueco; en modo trim desliza su contenido o su posicion. Arrastrar un rectangulo en modo seleccion selecciona clips; en modo trim selecciona cortes. Debajo, las tres partes de un corte: mitad saliente, centro y mitad entrante, que se rotan con la tecla U.">
  <title>El modo trim frente al modo selección</title>
  <style>
    .bg{fill:#101418}
    .clip{fill:#232b34;stroke:#2f3a45;stroke-width:1}
    .act{fill:#232b34;stroke:#4a9eff;stroke-width:2}
    .gap{fill:#101418;stroke:#f85149;stroke-width:1;stroke-dasharray:4 3}
    .card{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .t{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif}
    .h{font-size:15px;font-weight:600;fill:#e8eef4}
    .col{font-size:14px;font-weight:600;fill:#4a9eff}
    .lbl{font-size:13px;font-weight:600;fill:#e8eef4}
    .s{font-size:12px;fill:#93a1b0}
    .mini{font-size:12px;fill:#e8eef4}
    .am{font-size:12px;font-weight:600;fill:#f5a524}
  </style>
  <rect class="bg" width="880" height="470"/>
  <text class="t h" x="40" y="32">El mismo gesto significa dos cosas. El modo decide cuál.</text>

  <text class="t col" x="180" y="62">Selection Mode · A</text>
  <text class="t col" x="530" y="62">Trim Edit Mode · T</text>

  <text class="t lbl" x="40" y="100">Arrastrar</text>
  <text class="t lbl" x="40" y="118">un borde</text>
  <rect class="act" x="180" y="88" width="90" height="24" rx="3"/>
  <rect class="gap" x="272" y="88" width="46" height="24" rx="3"/>
  <rect class="clip" x="322" y="88" width="120" height="24" rx="3"/>
  <text class="t s" x="180" y="132">Resize: queda hueco</text>
  <rect class="act" x="530" y="88" width="90" height="24" rx="3"/>
  <rect class="clip" x="624" y="88" width="120" height="24" rx="3"/>
  <text class="t s" x="530" y="132">Ripple: se cierra solo</text>

  <text class="t lbl" x="40" y="176">Arrastrar</text>
  <text class="t lbl" x="40" y="194">el cuerpo</text>
  <rect class="gap" x="180" y="164" width="46" height="24" rx="3"/>
  <rect class="act" x="230" y="164" width="90" height="24" rx="3"/>
  <rect class="clip" x="324" y="164" width="118" height="24" rx="3"/>
  <text class="t s" x="180" y="208">lo mueve de sitio</text>
  <rect class="clip" x="530" y="164" width="90" height="24" rx="3"/>
  <rect class="act" x="624" y="164" width="90" height="24" rx="3"/>
  <rect class="clip" x="718" y="164" width="26" height="24" rx="3"/>
  <text class="t s" x="530" y="208">Slip o Slide, según dónde agarres</text>

  <text class="t lbl" x="40" y="252">Arrastrar un</text>
  <text class="t lbl" x="40" y="270">rectángulo</text>
  <rect class="act" x="180" y="240" width="120" height="24" rx="3"/>
  <rect class="act" x="304" y="240" width="138" height="24" rx="3"/>
  <text class="t s" x="180" y="284">selecciona clips</text>
  <rect class="clip" x="530" y="240" width="120" height="24" rx="3"/>
  <rect class="clip" x="654" y="240" width="90" height="24" rx="3"/>
  <rect x="646" y="236" width="12" height="32" fill="#4a9eff"/>
  <rect x="522" y="236" width="12" height="32" fill="#4a9eff"/>
  <text class="t s" x="530" y="284">selecciona cortes</text>

  <rect class="card" x="40" y="308" width="800" height="140" rx="4"/>
  <text class="t lbl" x="60" y="334">Las tres partes de un corte · se rotan con la tecla U</text>

  <rect class="clip" x="60" y="352" width="150" height="28" rx="3"/>
  <rect class="clip" x="212" y="352" width="150" height="28" rx="3"/>
  <rect x="196" y="348" width="16" height="36" fill="#4a9eff"/>
  <text class="t s" x="60" y="400">saliente · ripple o resize del final de A</text>

  <rect class="clip" x="392" y="352" width="86" height="28" rx="3"/>
  <rect class="clip" x="480" y="352" width="86" height="28" rx="3"/>
  <rect x="462" y="348" width="36" height="36" fill="#4a9eff"/>
  <text class="t s" x="392" y="400">centrado · roll</text>

  <rect class="clip" x="596" y="352" width="110" height="28" rx="3"/>
  <rect class="clip" x="708" y="352" width="112" height="28" rx="3"/>
  <rect x="708" y="348" width="16" height="36" fill="#4a9eff"/>
  <text class="t s" x="596" y="400">entrante · ripple o resize del principio de B</text>

  <text class="t am" x="60" y="428">Roll es la única operación que hace lo mismo en los dos modos.</text>
</svg>
