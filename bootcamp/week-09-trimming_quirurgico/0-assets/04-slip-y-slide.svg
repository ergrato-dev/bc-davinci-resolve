<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" role="img"
     aria-label="Comparacion entre slip y slide. En el slip, el clip B no se mueve ni cambia de duracion, pero la ventana de material que enseña se desplaza sobre el archivo original: los vecinos A y C no se tocan. En el slide, el clip B conserva el mismo contenido pero se mueve a la derecha, de forma que A se alarga y C se acorta. Debajo, el visor partido en cuatro: en un slip se actualizan los dos cuadros de arriba, la entrada y la salida del clip; en un slide se actualizan los dos de abajo, la salida del vecino izquierdo y la entrada del derecho.">
  <title>Slip frente a slide</title>
  <style>
    .bg{fill:#101418}
    .clip{fill:#232b34;stroke:#2f3a45;stroke-width:1}
    .act{fill:#232b34;stroke:#4a9eff;stroke-width:2}
    .src{fill:#191f26;stroke:#2f3a45;stroke-width:1;stroke-dasharray:4 3}
    .card{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .frame{fill:#101418;stroke:#2f3a45;stroke-width:1}
    .hot{fill:#101418;stroke:#4a9eff;stroke-width:2}
    .t{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif}
    .h{font-size:15px;font-weight:600;fill:#e8eef4}
    .col{font-size:14px;font-weight:600;fill:#4a9eff}
    .lbl{font-size:13px;font-weight:600;fill:#e8eef4}
    .s{font-size:12px;fill:#93a1b0}
    .mini{font-size:12px;fill:#e8eef4}
    .ok{font-size:12px;font-weight:600;fill:#3fb950}
  </style>
  <rect class="bg" width="880" height="490"/>
  <text class="t h" x="40" y="32">Las dos operaciones que se hacen sobre un clip entero. Ninguna cambia la duración de la pieza.</text>

  <text class="t col" x="40" y="68">SLIP · el clip se queda, el contenido se mueve</text>
  <rect class="src" x="200" y="82" width="360" height="20" rx="3"/>
  <text class="t s" x="576" y="97">material disponible del clip B</text>
  <rect class="clip" x="140" y="112" width="150" height="26" rx="3"/>
  <rect class="act" x="294" y="112" width="150" height="26" rx="3"/>
  <rect class="clip" x="448" y="112" width="150" height="26" rx="3"/>
  <text class="t mini" x="205" y="130">A</text>
  <text class="t mini" x="360" y="130">B′</text>
  <text class="t mini" x="515" y="130">C</text>
  <text class="t ok" x="620" y="130">bordes intactos</text>
  <text class="t s" x="140" y="160">La ventana no se mueve: se mueve el material por detrás. Los dos cortes siguen donde estaban.</text>

  <text class="t col" x="40" y="204">SLIDE · el contenido se queda, el clip se mueve</text>
  <text class="t lbl" x="40" y="236">antes</text>
  <rect class="clip" x="140" y="220" width="150" height="26" rx="3"/>
  <rect class="clip" x="294" y="220" width="150" height="26" rx="3"/>
  <rect class="clip" x="448" y="220" width="150" height="26" rx="3"/>
  <text class="t mini" x="205" y="238">A</text>
  <text class="t mini" x="360" y="238">B</text>
  <text class="t mini" x="515" y="238">C</text>

  <text class="t lbl" x="40" y="278">después</text>
  <rect class="act" x="140" y="262" width="212" height="26" rx="3"/>
  <rect class="clip" x="356" y="262" width="150" height="26" rx="3"/>
  <rect class="act" x="510" y="262" width="88" height="26" rx="3"/>
  <text class="t mini" x="236" y="280">A</text>
  <text class="t mini" x="422" y="280">B</text>
  <text class="t mini" x="545" y="280">C</text>
  <text class="t ok" x="620" y="280">B enseña lo mismo</text>

  <rect class="card" x="40" y="312" width="800" height="156" rx="4"/>
  <text class="t lbl" x="60" y="338">El visor partido en cuatro · mira qué mitad se está moviendo</text>

  <rect class="hot" x="60" y="352" width="120" height="46" rx="3"/>
  <rect class="hot" x="186" y="352" width="120" height="46" rx="3"/>
  <rect class="frame" x="60" y="404" width="120" height="46" rx="3"/>
  <rect class="frame" x="186" y="404" width="120" height="46" rx="3"/>
  <text class="t s" x="72" y="378">entrada de B</text>
  <text class="t s" x="198" y="378">salida de B</text>
  <text class="t s" x="72" y="430">salida de A</text>
  <text class="t s" x="198" y="430">entrada de C</text>
  <text class="t lbl" x="330" y="376">SLIP</text>
  <text class="t s" x="330" y="396">se actualizan los dos cuadros de arriba,</text>
  <text class="t s" x="330" y="414">porque lo que cambia es el contenido</text>
  <text class="t lbl" x="620" y="376">SLIDE</text>
  <text class="t s" x="620" y="396">se actualizan los dos de abajo,</text>
  <text class="t s" x="620" y="414">porque cambia dónde cortan los vecinos</text>
  <text class="t s" x="330" y="444">Un slip gasta cola del clip que deslizas · un slide gasta cola de sus dos vecinos.</text>
</svg>
