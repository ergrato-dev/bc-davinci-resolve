<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img"
     aria-label="Esquema de la pagina Media de DaVinci Resolve con sus cinco paneles: Media Storage arriba a la izquierda, el viewer en el centro, el panel Metadata a la derecha, el media pool abajo y el Clone Tool junto al panel de audio. Debajo, la idea de que importar crea una referencia y no una copia.">
  <title>Los paneles de la página Media y qué significa importar</title>
  <style>
    .bg   { fill: #101418; }
    .surf { fill: #191f26; stroke: #2f3a45; stroke-width: 1; }
    .surf2{ fill: #232b34; stroke: #2f3a45; stroke-width: 1; }
    .t    { font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
    .h    { font-size: 15px; font-weight: 600; fill: #e8eef4; }
    .lbl  { font-size: 13px; font-weight: 600; fill: #e8eef4; }
    .s    { font-size: 12px; fill: #93a1b0; }
  </style>

  <rect class="bg" width="880" height="430"/>
  <text class="t h" x="40" y="38">La página Media, panel por panel</text>
  <text class="t s" x="40" y="58">Todos se muestran y se ocultan desde la barra de la propia página y desde el menú Workspace</text>

  <rect class="surf" x="40" y="80" width="800" height="212" rx="6"/>

  <rect class="surf2" x="56" y="96" width="240" height="106" rx="4"/>
  <rect x="56" y="96" width="4" height="106" fill="#4a9eff"/>
  <text class="t lbl" x="72" y="118">Media Storage</text>
  <text class="t s"   x="72" y="138">Tu disco, tal cual está.</text>
  <text class="t s"   x="72" y="156">Todavía no es tu proyecto:</text>
  <text class="t s"   x="72" y="174">es el escaparate del que</text>
  <text class="t s"   x="72" y="192">arrastras al media pool.</text>

  <rect class="surf2" x="308" y="96" width="238" height="106" rx="4"/>
  <rect x="308" y="96" width="4" height="106" fill="#3fb950"/>
  <text class="t lbl" x="324" y="118">Viewer</text>
  <text class="t s"   x="324" y="138">Para mirar antes de decidir.</text>
  <text class="t s"   x="324" y="156">Aquí se ve si un clip sirve,</text>
  <text class="t s"   x="324" y="174">si está desenfocado o si</text>
  <text class="t s"   x="324" y="192">el audio llegó.</text>

  <rect class="surf2" x="558" y="96" width="266" height="106" rx="4"/>
  <rect x="558" y="96" width="4" height="106" fill="#f5a524"/>
  <text class="t lbl" x="574" y="118">Metadata</text>
  <text class="t s"   x="574" y="138">Descripción, keywords, escena,</text>
  <text class="t s"   x="574" y="156">plano y toma. Es lo que hace</text>
  <text class="t s"   x="574" y="174">que un clip se pueda encontrar</text>
  <text class="t s"   x="574" y="192">dentro de nueve meses.</text>

  <rect class="surf2" x="56" y="214" width="490" height="62" rx="4"/>
  <rect x="56" y="214" width="4" height="62" fill="#a371f7"/>
  <text class="t lbl" x="72" y="236">Media Pool</text>
  <text class="t s"   x="72" y="258">El proyecto: bins, clips y timelines. Lo único que viaja en el .drp</text>

  <rect class="surf2" x="558" y="214" width="266" height="62" rx="4"/>
  <rect x="558" y="214" width="4" height="62" fill="#f85149"/>
  <text class="t lbl" x="574" y="236">Clone Tool</text>
  <text class="t s"   x="574" y="258">Copiar tarjetas con verificación</text>

  <rect class="surf" x="40" y="312" width="800" height="82" rx="6"/>
  <text class="t lbl" x="60" y="338">Importar no copia nada</text>
  <text class="t s"   x="60" y="360">El media pool guarda una referencia: la ruta del archivo, no el archivo. Por eso un proyecto</text>
  <text class="t s"   x="60" y="378">pesa unos megabytes, y por eso mover la carpeta de material deja los clips offline.</text>

  <text class="t s" x="40" y="418">Verificado en DaVinci Resolve 21.0.4.5, agosto de 2026.</text>
</svg>
