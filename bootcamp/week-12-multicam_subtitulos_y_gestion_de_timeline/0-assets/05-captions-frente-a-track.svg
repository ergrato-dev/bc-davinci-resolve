<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img"
     aria-label="Los dos paneles del Inspector de un subtitulo: Captions, que edita el texto de un subtitulo y lleva la lista de todos, y Track, que fija el estilo de la pista entera. La casilla Customize Caption es la que permite que un subtitulo suelto se salga del estilo de la pista.">
  <title>Captions frente a Track</title>
  <style>
    .bg{fill:#101418}
    .card{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .row{fill:#232b34;stroke:#2f3a45;stroke-width:1}
    .t{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif}
    .h{font-size:15px;font-weight:600;fill:#e8eef4}
    .col{font-size:13px;font-weight:600;fill:#4a9eff}
    .s{font-size:12px;fill:#93a1b0}
    .am{font-size:12px;font-weight:600;fill:#f5a524}
    .ok{font-size:12px;font-weight:600;fill:#3fb950}
  </style>
  <rect class="bg" width="880" height="420"/>
  <text class="t h" x="40" y="34">Captions es el texto de UNO. Track es el estilo de TODOS.</text>

  <rect class="card" x="40" y="56" width="390" height="270" rx="4"/>
  <text class="t col" x="60" y="80">CAPTIONS · el subtítulo seleccionado</text>
  <rect class="row" x="60" y="94" width="350" height="46" rx="3"/>
  <text class="t s" x="74" y="114">Caption</text>
  <text class="t s" x="74" y="132">— No sabía que trabajabas aquí.</text>
  <rect class="row" x="60" y="150" width="350" height="26" rx="3"/>
  <text class="t s" x="74" y="168">Customize Caption</text>
  <rect x="382" y="156" width="14" height="14" rx="2" fill="#232b34" stroke="#f5a524" stroke-width="1.5"/>
  <text class="t am" x="60" y="196">marcarla saca este subtítulo del estilo de la pista</text>
  <text class="t s" x="60" y="224">Debajo, la lista de todos los subtítulos de la pista:</text>
  <rect class="row" x="60" y="238" width="350" height="22" rx="3"/>
  <text class="t s" x="74" y="254">01 · 00:00:04:12 · CPS 14</text>
  <rect class="row" x="60" y="266" width="350" height="22" rx="3"/>
  <text class="t s" x="74" y="282">02 · 00:00:07:03 · CPS 21</text>
  <rect class="row" x="60" y="294" width="350" height="22" rx="3"/>
  <text class="t s" x="74" y="310">03 · 00:00:09:18 · CPS 33</text>
  <text class="t" x="330" y="310" font-size="12" font-weight="600" fill="#f85149">se pasa</text>

  <rect class="card" x="450" y="56" width="390" height="270" rx="4"/>
  <text class="t col" x="470" y="80">TRACK · la pista entera</text>
  <text class="t s" x="470" y="106">Style and Position</text>
  <text class="t s" x="490" y="126">Font · Font Face · Color · Size</text>
  <text class="t s" x="490" y="146">Line Spacing · Kerning · Alignment</text>
  <text class="t s" x="490" y="166">Position X e Y · Zoom X e Y · Opacity</text>
  <text class="t s" x="490" y="186">Text Anchoring</text>
  <text class="t s" x="470" y="214">Al final del panel, tres grupos más:</text>
  <text class="t s" x="490" y="234">Drop Shadow · Stroke · Background</text>
  <text class="t s" x="470" y="262">Subtitle Settings</text>
  <text class="t s" x="490" y="282">Use Project Settings, desmarcable</text>
  <text class="t s" x="490" y="302">Max Line Length · Min Duration · Max CPS</text>

  <rect class="card" x="40" y="342" width="800" height="62" rx="4"/>
  <text class="t ok" x="60" y="366">EL ORDEN QUE AHORRA LA TARDE</text>
  <text class="t s" x="60" y="388">1 · crear la pista   2 · renombrarla con su idioma   3 · dar el estilo en Track   4 · escribir los subtítulos   5 · guardar el estilo con Save Track as Preset</text>
</svg>
