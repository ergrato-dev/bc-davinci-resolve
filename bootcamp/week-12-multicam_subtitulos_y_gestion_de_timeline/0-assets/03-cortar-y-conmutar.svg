<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img"
     aria-label="El Multicam Viewer con cuatro angulos en rejilla. Un clic sobre un angulo corta y conmuta: parte el clip en la timeline y a partir de ahi se ve ese angulo. Un Alt-clic solo conmuta: cambia el angulo del tramo actual sin anadir corte.">
  <title>Cortar y conmutar</title>
  <style>
    .bg{fill:#101418}
    .card{fill:#191f26;stroke:#2f3a45;stroke-width:1}
    .ang{fill:#232b34;stroke:#2f3a45;stroke-width:1}
    .sel{fill:#232b34;stroke:#4a9eff;stroke-width:2}
    .clip{fill:#232b34;stroke:#2f3a45;stroke-width:1}
    .t{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif}
    .h{font-size:15px;font-weight:600;fill:#e8eef4}
    .col{font-size:13px;font-weight:600;fill:#4a9eff}
    .s{font-size:12px;fill:#93a1b0}
    .ok{font-size:12px;font-weight:600;fill:#3fb950}
    .am{font-size:12px;font-weight:600;fill:#f5a524}
  </style>
  <rect class="bg" width="880" height="440"/>
  <text class="t h" x="40" y="34">Clic corta y conmuta. Alt+clic solo conmuta.</text>

  <rect class="card" x="40" y="56" width="330" height="230" rx="4"/>
  <text class="t col" x="60" y="80">MULTICAM VIEWER · rejilla 2x2</text>
  <rect class="sel" x="60" y="94" width="140" height="80" rx="3"/>
  <text class="t s" x="76" y="140">CAM-A</text>
  <rect class="ang" x="212" y="94" width="140" height="80" rx="3"/>
  <text class="t s" x="228" y="140">CAM-B</text>
  <rect class="ang" x="60" y="184" width="140" height="80" rx="3"/>
  <text class="t s" x="76" y="230">CAM-C</text>
  <rect class="ang" x="212" y="184" width="140" height="80" rx="3"/>
  <text class="t s" x="228" y="230">CAM-D</text>
  <text class="t s" x="60" y="282">teclas 1 a 9 · cortan y conmutan</text>

  <text class="t col" x="404" y="80">CLIC · corta y conmuta</text>
  <text class="t s" x="404" y="102">El clip se parte en el cabezal y a partir de ahí se ve el ángulo nuevo.</text>
  <rect class="clip" x="404" y="116" width="120" height="26" rx="3"/>
  <text class="t s" x="420" y="134">CAM-A</text>
  <rect class="clip" x="524" y="116" width="120" height="26" rx="3"/>
  <text class="t s" x="540" y="134">CAM-B</text>
  <rect class="clip" x="644" y="116" width="120" height="26" rx="3"/>
  <text class="t s" x="660" y="134">CAM-C</text>
  <line x1="524" y1="110" x2="524" y2="148" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="644" y1="110" x2="644" y2="148" stroke="#3fb950" stroke-width="1.5"/>
  <text class="t ok" x="404" y="166">dos cortes nuevos</text>

  <text class="t col" x="404" y="206">ALT+CLIC · solo conmuta</text>
  <text class="t s" x="404" y="228">El tramo entero desde el último corte cambia de ángulo. No aparece corte nuevo.</text>
  <rect class="clip" x="404" y="242" width="120" height="26" rx="3"/>
  <text class="t s" x="420" y="260">CAM-A</text>
  <rect class="clip" x="524" y="242" width="240" height="26" rx="3"/>
  <text class="t s" x="600" y="260">CAM-D · antes era CAM-B</text>
  <line x1="524" y1="236" x2="524" y2="274" stroke="#3fb950" stroke-width="1.5"/>
  <text class="t am" x="404" y="292">es el arreglo: te has equivocado de ángulo y no quieres tocar el ritmo</text>

  <line x1="40" y1="316" x2="840" y2="316" stroke="#2f3a45" stroke-width="1"/>

  <rect class="card" x="40" y="336" width="390" height="86" rx="4"/>
  <text class="t col" x="60" y="360">QUÉ SE CONMUTA</text>
  <text class="t s" x="60" y="382">Vídeo y audio · Solo vídeo · Solo audio</text>
  <text class="t s" x="60" y="404">Los tres botones del centro del visor, o el menú Edit &gt; Multicam.</text>

  <rect class="card" x="450" y="336" width="390" height="86" rx="4"/>
  <text class="t col" x="470" y="360">DESPUÉS, EN LA TIMELINE</text>
  <text class="t s" x="470" y="382">Switch Multicam Clip Angle · cambia el ángulo sin el visor.</text>
  <text class="t s" x="470" y="404">Flatten Multicam Clip · tira los ángulos no usados. No hay vuelta atrás.</text>
</svg>
